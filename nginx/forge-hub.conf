location = /hub {
    return 301 /hub/$is_args$args;
}

location ^~ /hub/static/ {
    alias /home/heubuchm/spienx/spienx-hub/staticfiles/;
}

location ~ ^/hub/git(?<hub_git_path>/.*)$ {
    auth_basic "Spienx Git";
    auth_basic_user_file /etc/nginx/git.htpasswd;
    client_max_body_size 0;
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
    fastcgi_param GIT_HTTP_EXPORT_ALL "";
    fastcgi_param GIT_PROJECT_ROOT /git;
    fastcgi_param PATH_INFO $hub_git_path;
    fastcgi_param REMOTE_USER $remote_user;
    fastcgi_pass 127.0.0.1:9002;
}

location /hub/ {
    client_max_body_size 512M;
    proxy_pass http://127.0.0.1:8001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade_keepalive;
    proxy_redirect default;
    proxy_buffering off;
}
